name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unpack project
        run: unzip -o CarBass.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: CarBass
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CarBass-apk
          path: CarBass/app/build/outputs/apk/debug/*.apk

      - name: Save APK to repo
        run: |
          mkdir -p release
          cp CarBass/app/build/outputs/apk/debug/app-debug.apk release/CarBass.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add release/CarBass.apk
          git commit -m "Add built APK [skip ci]" || exit 0
          git push
